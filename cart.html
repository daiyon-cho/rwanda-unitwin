<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | Kigali Threads</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Kigali<span>Threads</span></a>
      <nav class="nav">
        <a href="index.html">Shop</a>
        <a href="cart.html" class="cart-link" aria-current="page">Cart <span class="badge" data-cart-count hidden>0</span></a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Your cart</h1>
    <div class="cart-layout">
      <div id="cart-items" class="cart-items"></div>
      <aside id="cart-summary" class="cart-summary" hidden>
        <div class="summary-row"><span>Total</span><strong id="cart-total"></strong></div>
        <button class="btn btn-block" id="checkout-btn">Checkout</button>
        <a href="index.html" class="muted continue">Continue shopping</a>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">© Kigali Threads · Photos from <a href="https://unsplash.com">Unsplash</a></div>
  </footer>

  <script type="module" src="js/cart-page.js"></script>
</body>
</html>
